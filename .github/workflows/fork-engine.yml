# Fork-owned, hand-written (not generated by `cargo x workflows`).
# Builds everything `just run_local --no-doppler --static-frontend
# --no-computers` would otherwise compile on the self-hosted machine, on free
# GitHub-hosted runners, starts that stack once here to prove the set is
# complete, and publishes it as a prerelease on this fork for
# infra/local/self-host/fetch-engine. Runs only on pushes to fork/builds.
name: Fork engine programs
'on':
  push:
    branches:
    - fork/builds
    paths-ignore:
    - CLAUDE.md
    - .github/workflows/fork-desktop.yml
permissions:
  contents: read
concurrency:
  group: fork-engine
  cancel-in-progress: true
env:
  INSTANCE: home
  PORT_BASE: '24000'
  # Smaller, faster debug builds; nothing on the instance reads debug info.
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  services:
    name: Build the service programs and the start tool
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Free disk space
      run: infra/local/self-host/ci-runner-setup disk
    - name: Install Nix
      run: infra/local/self-host/ci-runner-setup nix
    - name: Enter the dev shell
      # Kept as a profile so its whole closure can be published.
      run: |
        set -euo pipefail
        nix develop --profile "$RUNNER_TEMP/devshell" --command true 2>&1 | tee "$RUNNER_TEMP/devshell.log"
        echo "store paths built here (not downloaded): $(grep -c "^building '/nix/store" "$RUNNER_TEMP/devshell.log" || true)"
        nix path-info -rSh "$RUNNER_TEMP/devshell" | tail -n 1
        df -h / /nix
    - name: Install JavaScript dependencies
      run: |
        set -euo pipefail
        nix develop --command bun install --frozen-lockfile
        (cd packages/sdk && nix develop --command bun install --frozen-lockfile)
    - name: Build the service programs
      # The command tooling/xtask/crates/xtask_local/src/local/build/cargo_build.rs
      # runs: every non-opt-in service in inventory.rs, with their local features.
      run: |
        set -euo pipefail
        infra/local/self-host/ci-runner-setup big-dir /work-target
        ln -sfn /work-target target
        SQLX_OFFLINE=true nix develop --command cargo build \
          --bin agent_harness_service --bin authentication_service --bin calendar_service \
          --bin connection_gateway_service --bin contacts_service --bin document_storage_service \
          --bin document_upload_finalizer_local_worker --bin email_service --bin gmail_emulator \
          --bin image_proxy_service --bin notification_service --bin outlook_emulator \
          --bin pubsub_workers --bin search_processing_service --bin seed_cli \
          --bin static_file_service --bin unfurl_service --bin whatsapp_session_service \
          --features authentication_service/return_passwordless_code,authentication_service/no_rate_limit,search_processing_service/no_pdf
        df -h / /work-target
    - name: Build the start tool
      # What `just run_local` compiles before it does anything (tooling/just/xtask.just).
      run: nix develop --command cargo build --manifest-path Cargo.toml --target-dir target/xtask -p xtask_local --features local-stack
    - name: Collect the programs and the Nix store paths they need
      run: |
        set -euo pipefail
        mkdir -p pkg/bin
        bins=(agent_harness_service authentication_service calendar_service
          connection_gateway_service contacts_service document_storage_service
          document_upload_finalizer_local_worker email_service gmail_emulator
          image_proxy_service notification_service outlook_emulator pubsub_workers
          search_processing_service seed_cli static_file_service unfurl_service
          whatsapp_session_service)
        for b in "${bins[@]}"; do cp "target/debug/$b" pkg/bin/; done
        cp target/xtask/debug/xtask_local pkg/bin/
        strip pkg/bin/*
        ls -l pkg/bin
        # Every /nix/store path the programs load from, then their closures
        # together with the dev shell's.
        for f in pkg/bin/*; do
          ldd "$f" | grep -o '/nix/store/[^/ ]*'
          readelf -l "$f" | grep -o '/nix/store/[^/ ]*'
        done | sort -u >"$RUNNER_TEMP/roots"
        echo "missing libraries: $(for f in pkg/bin/*; do ldd "$f"; done | grep -c 'not found' || true)"
        nix-store -qR $(cat "$RUNNER_TEMP/roots") "$(readlink -f "$RUNNER_TEMP/devshell")" | sort -u >"$RUNNER_TEMP/closure"
        wc -l <"$RUNNER_TEMP/closure"
        # Paths cache.nixos.org serves are fetched from there; only the rest
        # travel with the release.
        : >pkg/nix-substitute.txt
        : >"$RUNNER_TEMP/local-only"
        while read -r p; do
          h="$(basename "$p" | cut -d- -f1)"
          echo "$p $h"
        done <"$RUNNER_TEMP/closure" | xargs -P 16 -L 1 sh -c \
          'if curl -sfI "https://cache.nixos.org/$1.narinfo" >/dev/null; then echo "$0" >>pkg/nix-substitute.txt; else echo "$0" >>"$RUNNER_TEMP/local-only"; fi'
        sort -o pkg/nix-substitute.txt pkg/nix-substitute.txt
        sort -o "$RUNNER_TEMP/local-only" "$RUNNER_TEMP/local-only"
        echo "from cache.nixos.org: $(wc -l <pkg/nix-substitute.txt), local-only: $(wc -l <"$RUNNER_TEMP/local-only")"
        # Export in dependency order so an import never meets a missing reference.
        nix-store -qR $(cat "$RUNNER_TEMP/local-only") | grep -Fxf "$RUNNER_TEMP/local-only" >"$RUNNER_TEMP/local-ordered" || true
        nix-store --export $(cat "$RUNNER_TEMP/local-ordered") | zstd -T0 -10 -o pkg/nix-local.nar.zst
        cp "$RUNNER_TEMP/local-ordered" pkg/nix-local.txt
        readlink -f "$RUNNER_TEMP/devshell" >pkg/devshell.txt
        du -sh pkg/*
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: engine-services
        path: pkg
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  frontend:
    name: Build the static web app
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Free disk space
      run: infra/local/self-host/ci-runner-setup disk
    - name: Install Nix
      run: infra/local/self-host/ci-runner-setup nix
    - name: Build the bundle
      # The build tooling/xtask/crates/xtask_local/src/local/frontend.rs runs
      # for --static-frontend: dev:prepare, then static_build_command's env.
      run: |
        set -euo pipefail
        flags="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":"), sort_keys=True))' infra/local/self-host/feature-flags.json)"
        nix develop --command bun install --frozen-lockfile
        cd apps/web
        WASM_PKG_CACHE_DIR="$RUNNER_TEMP/wasm-pkgs" nix develop --command bun run dev:prepare
        nix develop --command env \
          MODE=development NODE_ENV=production \
          VITE_LOCAL_SERVERS=ALL VITE_LOCAL_BACKEND_ORIGIN=same-origin VITE_LOCAL_ONLY=true \
          VITE_AI_EDITING_WORKER_URL=/ai-editing VITE_LOCAL_STACK=true \
          VITE_LOCAL_FEATURE_FLAGS="$flags" \
          NODE_OPTIONS=--max-old-space-size=8192 \
          bun run --bun build
        test -f dist/index.html
        mkdir -p ../../pkg
        tar -C dist -cf - . | zstd -T0 -10 -o ../../pkg/frontend.tar.zst
        du -sh dist ../../pkg/frontend.tar.zst
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: engine-frontend
        path: pkg
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  stack:
    name: Start the stack from the prebuilt set and keep its images
    needs: [services, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Free disk space
      run: infra/local/self-host/ci-runner-setup disk
    - name: Install Nix
      run: infra/local/self-host/ci-runner-setup nix
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: engine-services
        path: dl
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: engine-frontend
        path: dl
    - name: Lay out the set the way fetch-engine does
      run: |
        set -euo pipefail
        infra/local/self-host/fetch-engine --from-dir "$PWD/dl" --dest "$HOME/macro-instance/prebuilt"
        ls -l "$HOME/macro-instance/prebuilt" "$HOME/macro-instance/prebuilt/current/bin"
    - name: Show how each program finds its libraries
      # The services run in the runtime image (docker/Dockerfile.runtime:
      # Debian, /nix/store and the bin dir mounted read-only per
      # build/binaries_dir.rs compose_mounts, no LD_LIBRARY_PATH). xtask_local
      # runs on the host inside `nix develop` (engine's in_shell), whose
      # LD_LIBRARY_PATH carries the dev shell's libraries. Each program is
      # resolved by its own loader in that environment; Ubuntu's ldd uses
      # Ubuntu's loader and search path, which hides misses.
      run: infra/local/self-host/check-engine-libs host "$HOME/macro-instance/prebuilt/current/bin"
    - name: Start the stack (detached, like infra/local/self-host/engine)
      run: |
        set -euo pipefail
        cur="$HOME/macro-instance/prebuilt/current"
        export MACRO_LOCAL_FEATURE_FLAGS="$PWD/infra/local/self-host/feature-flags.json"
        export MACRO_LOCAL_STATIC_BUNDLE="$cur/frontend"
        nix develop --command "$cur/bin/xtask_local" run-local --detach --no-doppler \
          --instance "$INSTANCE" --port-base "$PORT_BASE" --static-frontend --traces off \
          --no-computers --binaries-dir "$cur/bin" 2>&1 | tee "$RUNNER_TEMP/run-local.log"
        if grep -E "Building service binaries|Building frontend bundle|Preparing frontend dependencies" "$RUNNER_TEMP/run-local.log"; then
          echo "run_local compiled something it should have taken from the prebuilt set" >&2
          exit 1
        fi
    - name: List what runs
      run: |
        set -euo pipefail
        cur="$HOME/macro-instance/prebuilt/current"
        nix develop --command "$cur/bin/xtask_local" run-local status --json --instance "$INSTANCE" | tee "$RUNNER_TEMP/status.json"
        project="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["project"])' "$RUNNER_TEMP/status.json")"
        docker ps -a --filter "label=com.docker.compose.project=$project" \
          --format '{{.Label "com.docker.compose.service"}} {{.Image}} {{.Status}}' | sort | tee "$RUNNER_TEMP/services.txt"
        runtime="$(docker images macro-local-runtime --format '{{.Repository}}:{{.Tag}}' | head -n 1)"
        infra/local/self-host/check-engine-libs container "$cur/bin" "$runtime"
        if grep -v ' Up ' "$RUNNER_TEMP/services.txt" | grep -E 'Exited \([1-9]|Restarting|Dead'; then
          echo "some containers are not up" >&2
          exit 1
        fi
        mkdir -p pkg
        cp "$RUNNER_TEMP/services.txt" pkg/services.txt
        cp "$RUNNER_TEMP/status.json" pkg/status.json
    - name: Save the images built from this repository
      run: |
        set -euo pipefail
        # Pulled images (postgres, opensearch base, nginx, ...) come from their
        # registries on the instance too; only images built here travel.
        awk '{print $2}' pkg/services.txt | sort -u | while read -r image; do
          if docker image inspect "$image" --format '{{index .RepoDigests 0}}' >/dev/null 2>&1 \
            && [[ -n "$(docker image inspect "$image" --format '{{join .RepoDigests ""}}')" ]]; then
            continue
          fi
          echo "$image"
        done >pkg/images.txt
        cat pkg/images.txt
        while read -r image; do
          name="$(printf '%s' "$image" | tr '/:' '__')"
          docker save "$image" | zstd -T0 -10 -o "pkg/image-$name.tar.zst"
        done <pkg/images.txt
        du -sh pkg/*
    - name: Show why the stack failed
      if: failure()
      run: |
        docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' || true
        for c in $(docker ps -a --filter status=exited --filter status=restarting --filter status=dead --format '{{.Names}}'); do
          echo "== $c"
          docker logs --tail 50 "$c" 2>&1 || true
        done
        free -m || true
        df -h / /nix || true
    - name: Stop the stack
      if: always()
      run: |
        cur="$HOME/macro-instance/prebuilt/current"
        nix develop --command "$cur/bin/xtask_local" run-local stop --instance "$INSTANCE" || true
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: engine-images
        path: pkg
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  publish:
    name: Publish the engine programs
    needs: [services, frontend, stack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: dl
        merge-multiple: true
    - name: Package and create the prerelease
      # A prerelease never fires `release: released`, and the tag matches
      # neither v[0-9]* nor sdk-v*, so no upstream workflow starts.
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p out
        tar -C dl -cf - bin | zstd -T0 -10 -o out/engine-bin.tar.zst
        cp dl/frontend.tar.zst dl/nix-substitute.txt dl/nix-local.txt dl/devshell.txt \
          dl/images.txt dl/services.txt dl/status.json out/
        cp dl/image-*.tar.zst out/ 2>/dev/null || true
        # Release assets are capped at 2 GiB each.
        for f in dl/nix-local.nar.zst; do
          split -b 1900M -d -a 2 "$f" "out/$(basename "$f").part"
        done
        printf '{"commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >out/build.json
        (cd out && sha256sum -- * >SHA256SUMS)
        cat out/SHA256SUMS
        ls -l out
        tag="fork-engine-${GITHUB_SHA::10}"
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
          --title "Engine programs $tag" \
          --notes "Prebuilt local stack (run_local --no-doppler --static-frontend --no-computers) for a self-hosted instance. Fetch with infra/local/self-host/fetch-engine. Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
          out/*

  fetch:
    name: Fetch the published set on a fresh runner and check it
    # Exercises fetch-engine on the real release (no key, plain HTTPS) and the
    # library check on what it installs; the stack job used --from-dir.
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Free disk space
      run: infra/local/self-host/ci-runner-setup disk
    - name: Install Nix
      run: infra/local/self-host/ci-runner-setup nix
    - name: List the release files
      run: |
        set -euo pipefail
        tag="fork-engine-${GITHUB_SHA::10}"
        curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" |
          python3 -c 'import json,sys
        for a in json.load(sys.stdin)["assets"]: print("%12d %s" % (a["size"], a["name"]))'
    - name: Fetch and install it
      env:
        MACRO_FORK_REPO: ${{ github.repository }}
      run: infra/local/self-host/fetch-engine --tag "fork-engine-${GITHUB_SHA::10}"
    - name: Every service the stack starts has its program
      # The list run_local builds: non-opt-in entries of inventory.rs
      # (local_binaries()), plus the start tool.
      run: |
        set -euo pipefail
        cur="$HOME/macro-instance/prebuilt/current"
        python3 - tooling/xtask/crates/xtask_local/src/local/inventory.rs "$cur/bin" <<'PY'
        import os, re, sys
        src = open(sys.argv[1]).read()
        want = set()
        for block in re.findall(r"RustService \{(.*?)\n    \}", src, re.S):
            name = re.search(r'cargo_bin: "([^"]+)"', block)
            optin = re.search(r"opt_in: (true|false)", block)
            if name and optin and optin.group(1) == "false":
                want.add(name.group(1))
        want.add("xtask_local")
        have = set(os.listdir(sys.argv[2]))
        print("expected:", len(want), "shipped:", len(have))
        for b in sorted(want | have):
            print(("ok      " if b in want and b in have else "MISSING " if b in want else "extra   ") + b)
        sys.exit(1 if want - have else 0)
        PY
        test -f "$cur/frontend/index.html" && du -sh "$cur/frontend"
    - name: Show how each program finds its libraries
      run: infra/local/self-host/check-engine-libs host "$HOME/macro-instance/prebuilt/current/bin"
