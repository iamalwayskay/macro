# Fork-owned, hand-written (not generated by `cargo x workflows`).
# Builds the Linux desktop app for Kay's self-hosted instance on a free
# GitHub-hosted runner and publishes it as a prerelease on this fork.
# Runs only on pushes to the fork/builds branch.
name: Fork desktop app
'on':
  push:
    branches:
    - fork/builds
    paths-ignore:
    - CLAUDE.md
    - .github/workflows/fork-engine.yml
    - infra/local/self-host/engine
    - infra/local/self-host/fetch-engine
    - infra/local/self-host/check-engine-libs
    - tooling/**
permissions:
  contents: read
concurrency:
  group: fork-desktop
  cancel-in-progress: true
env:
  # The self-hosted engine on the Haven sandbox (instance home, port base 24000).
  MACRO_ORIGIN: https://ai-sandbox:24090
jobs:
  desktop:
    name: Build the Linux desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Free disk space
      run: infra/local/self-host/ci-runner-setup disk
    - name: Install Nix
      run: infra/local/self-host/ci-runner-setup nix
    - name: Build the web bundle
      run: |
        set -euo pipefail
        flags="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":"), sort_keys=True))' infra/local/self-host/feature-flags.json)"
        nix develop --command bun install --frozen-lockfile
        (cd apps/web && nix develop --command env \
          VITE_LOCAL_SERVERS=ALL \
          VITE_LOCAL_BACKEND_ORIGIN="$MACRO_ORIGIN" \
          VITE_LOCAL_ONLY=true \
          VITE_LOCAL_STACK=true \
          VITE_AI_EDITING_WORKER_URL="$MACRO_ORIGIN/ai-editing" \
          VITE_LOCAL_FEATURE_FLAGS="$flags" \
          NODE_OPTIONS=--max-old-space-size=8192 \
          just build-tauri-dev)
        test -f apps/web/dist/index.html
        du -sh apps/web/dist
    - name: Let the app's native HTTP reach the instance
      # The app sends backend calls through tauri-plugin-http, whose scope in
      # capabilities/default.json lists only macro.com hosts and localhost.
      run: |
        set -euo pipefail
        python3 - "$MACRO_ORIGIN" <<'PY'
        import json, sys
        origin = sys.argv[1]
        cap = {
            "identifier": "self-host",
            "description": "native HTTP to the self-hosted instance",
            "windows": ["main"],
            "permissions": [
                {"identifier": "http:default", "allow": [{"url": origin}, {"url": origin + "/*"}]}
            ],
        }
        path = "apps/web/tauri/src-tauri/capabilities/self-host.json"
        open(path, "w").write(json.dumps(cap, indent=2) + "\n")
        print(open(path).read())
        PY
    - name: Install the native build dependencies
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential ca-certificates curl file git pkg-config libssl-dev \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
        rustup toolchain install 1.94.0 --profile minimal
        infra/local/self-host/ci-runner-setup big-dir /work-target
    - name: Build the native binary
      working-directory: apps/web/tauri/src-tauri
      env:
        RUSTUP_TOOLCHAIN: 1.94.0
        CARGO_TARGET_DIR: /work-target
        CARGO_PROFILE_RELEASE_DEBUG: '0'
      run: cargo build --release -p app --no-default-features --features tauri/custom-protocol
    - name: Collect and inspect the binary
      run: |
        set -euo pipefail
        mkdir -p out
        cp /work-target/release/app out/macro
        cp apps/web/tauri/src-tauri/icons/128x128.png out/macro.png
        file out/macro
        file out/macro | grep -q 'ELF 64-bit LSB pie executable, x86-64\|ELF 64-bit LSB executable, x86-64'
        echo "missing libraries: $(ldd out/macro | grep -c 'not found' || true)"
        count="$(strings out/macro | grep -c 'ai-sandbox:24090' || true)"
        echo "origin strings: $count"
        test "$count" -ge 1
        (cd out && sha256sum macro macro.png >SHA256SUMS)
        cat out/SHA256SUMS
        ls -l out
    - name: Upload the binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macro-desktop-linux-x86_64
        path: out/*
        if-no-files-found: error
        retention-days: 30
  publish:
    name: Publish the desktop app
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: macro-desktop-linux-x86_64
        path: out
    - name: Create the prerelease
      # A prerelease never fires `release: released`, and the tag matches
      # neither v[0-9]* nor sdk-v*, so no upstream workflow starts.
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="fork-desktop-${GITHUB_SHA::10}"
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
          --title "Desktop app $tag" \
          --notes "Linux desktop app (Ubuntu 24.04, x86-64) for the self-hosted instance at $MACRO_ORIGIN. Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
          out/macro out/macro.png out/SHA256SUMS
